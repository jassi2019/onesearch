<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OneSearch — Offline</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #0b0c12; color: #e8e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    text-align: center; padding: 24px;
  }
  .card { max-width: 340px; }
  img { width: 84px; height: 84px; border-radius: 22px; margin-bottom: 18px; }
  h1 {
    font-size: 22px; margin: 0 0 8px;
    background: linear-gradient(90deg, #a78bfa, #e879f9, #fb7185);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  p { color: #9a9ab0; font-size: 14px; line-height: 1.5; margin: 0 0 20px; }
  button {
    background: linear-gradient(90deg, #a78bfa, #e879f9); color: #0b0c12;
    border: 0; border-radius: 999px; padding: 12px 28px; font-size: 15px;
    font-weight: 700; cursor: pointer;
  }
</style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="OneSearch" />
    <h1>You're offline</h1>
    <p>OneSearch needs an internet connection to find images. Check your connection and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
